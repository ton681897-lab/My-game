function stick(zone,base,knob,move,end){
  let pid=null;
  const put=p=>knob.style.transform=`translate(${p[0]}px,${p[1]}px)`;
  const upd=e=>{const r=base.getBoundingClientRect(),sx=e.clientX-(r.left+r.width/2),sy=e.clientY-(r.top+r.height/2),rot=document.documentElement.classList.contains('rot');put(move(clamp(rot?sy:sx,-R,R),clamp(rot?-sx:sy,-R,R)))};
  zone.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;try{zone.setPointerCapture(pid)}catch(_){}upd(e);e.preventDefault()});
  zone.addEventListener('pointermove',e=>{if(e.pointerId===pid){upd(e);e.preventDefault()}});
  const up=e=>{if(e.pointerId===pid){pid=null;put(end())}};
  zone.addEventListener('pointerup',up);zone.addEventListener('pointercancel',up);
  put(end());
}

let ac=null,master=null,mo1,mo2,mg,ng,hg,noiseBuf,lastLB=0;
function audioInit(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    master=ac.createGain();master.gain.value=S.vol;master.connect(ac.destination);
    mg=ac.createGain();mg.gain.value=0;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3500;mg.connect(lp);lp.connect(master);
    mo1=ac.createOscillator();mo1.type='sawtooth';mo2=ac.createOscillator();mo2.type='square';
    const g2=ac.createGain();g2.gain.value=.25;mo1.connect(mg);mo2.connect(g2);g2.connect(mg);mo1.start();mo2.start();
    noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const mk=(type,f)=>{const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return g};
    ng=mk('bandpass',2500);hg=mk('highpass',3000);
  }catch(e){ac=null}
}
function beep(f,d,v){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}

/* ---------- signal ---------- */
function segHit(o,p,b){
  let t0=0,t1=1;const d=[p.x-o.x,p.y-o.y,p.z-o.z],O=[o.x,o.y,o.z],mn=[b.a,0,b.c],mx=[b.b,b.h,b.d];
  for(let i=0;i<3;i++){
    if(Math.abs(d[i])<1e-6){if(O[i]<mn[i]||O[i]>mx[i])return false}
    else{let a=(mn[i]-O[i])/d[i],c=(mx[i]-O[i])/d[i];if(a>c){const t=a;a=c;c=t}t0=Math.max(t0,a);t1=Math.min(t1,c);if(t0>t1)return false}
  }
  return true;
}
function signalTarget(){
  ant.set(START.x,1.5,START.z);
  const dist=ant.distanceTo(pos);
  let s=1-Math.max(0,dist-sigR[0])/sigR[1],blk=0;
  for(const b of boxes)if(b.big&&segHit(ant,pos,b))blk++;
  s-=Math.min(.7,blk*.3);
  if(pos.y<.2&&dist>10)s-=.15;
  s-=(1-hp/100)*.1;
  return clamp(s,0,1);
}

/* ---------- physics ---------- */
function step(dt){
  if(mode!=='acro'){
    const k=Math.min(1,dt*10);
    const tm=(mode==='a1'?.55:mode==='a3'?.85:.7)*S.tiltk;pit+=(-ex(inp.pit)*tm-pit)*k;rol+=(-ex(inp.rol)*tm-rol)*k;
    yaw-=ex(inp.yaw)*S.yawr*dt;
    eul.set(pit,yaw,rol,'YXZ');q.setFromEuler(eul);
  }else{
    tmp.set(-ex(inp.pit)*S.acror*dt,-ex(inp.yaw)*S.acror*.7*dt,-ex(inp.rol)*S.acror*dt,'YXZ');
    dq.setFromEuler(tmp);q.multiply(dq).normalize();
  }
  up.set(0,1,0).applyQuaternion(q);

  const target=TWR*Math.pow(inp.thr,2.66);
  thrNow+=(target-thrNow)*Math.min(1,dt*20);
  const I=0.4+(hi-0.4)*Math.pow(thrNow,0.6);
  if(S.bat)used+=I*dt/3.6;const frac=used/cap;
  volt=4.3-0.9*frac-0.7*Math.pow(frac,8)-I*0.045;
  if(frac>=1){crash('АКБ РАЗРЯЖЕН');return}
  const pw=clamp(0.45+(volt-3.2)*0.55,0.4,1);
  const f=thrNow*pw*(0.7+0.3*hp/100);
  acc.copy(up).multiplyScalar(f*G);acc.y-=G;
  vel.addScaledVector(acc,dt);
  const sf=mode==='acro'?S.a3:S[mode],sp2=sf*sf,cp2=S.climb*S.climb,sh=Math.hypot(vel.x,vel.z);
  const kh=Math.max(0,1-(0.3+0.08*sh)/sp2*dt),kv=Math.max(0,1-(0.12+0.02*Math.abs(vel.y))/(vel.y>0?cp2:S.fall*S.fall)*dt);
  vel.x*=kh;vel.z*=kh;vel.y*=kv;
  pos.addScaledVector(vel,dt);
  if(running)flightT+=dt;

  if(pos.y<=GY){
    const vi=-vel.y;pos.y=GY;
    if(vel.y<0){hurt(vi);vel.y=vi>2?vi*0.35:0}
    const fr=Math.max(0,1-5*dt);vel.x*=fr;vel.z*=fr;
    if(crashed)return;
  }
  {let vi=0;const e=.45,m=.06;
   if(pos.x<-HW+m){pos.x=-HW+m;vi=Math.max(vi,-vel.x);if(vel.x<0)vel.x*=-e}
   if(pos.x>HW-m){pos.x=HW-m;vi=Math.max(vi,vel.x);if(vel.x>0)vel.x*=-e}
   if(pos.z<-HD+m){pos.z=-HD+m;vi=Math.max(vi,-vel.z);if(vel.z<0)vel.z*=-e}
   if(pos.z>HD-m){pos.z=HD-m;vi=Math.max(vi,vel.z);if(vel.z>0)vel.z*=-e}
   if(pos.y>HH-m){pos.y=HH-m;vi=Math.max(vi,vel.y);if(vel.y>0)vel.y*=-e}
   if(vi>0){hurt(vi);if(crashed)return}}
  for(const b of boxes){
    if(pos.x>b.a&&pos.x<b.b&&pos.z>b.c&&pos.z<b.d&&pos.y<b.h){
      const d=[pos.x-b.a,b.b-pos.x,pos.z-b.c,b.d-pos.z,b.h-pos.y];
      let m=0;for(let i=1;i<5;i++)if(d[i]<d[m])m=i;
      let v=0;const e=.45;
      if(m===0){pos.x=b.a;v=Math.max(0,vel.x);if(vel.x>0)vel.x=-vel.x*e}
      else if(m===1){pos.x=b.b;v=Math.max(0,-vel.x);if(vel.x<0)vel.x=-vel.x*e}
      else if(m===2){pos.z=b.c;v=Math.max(0,vel.z);if(vel.z>0)vel.z=-vel.z*e}
      else if(m===3){pos.z=b.d;v=Math.max(0,-vel.z);if(vel.z<0)vel.z=-vel.z*e}
      else{pos.y=b.h;v=Math.max(0,-vel.y);if(vel.y<0)vel.y=-vel.y*e*.6;vel.x*=.9;vel.z*=.9}
      hurt(v);if(crashed)return;
    }
  }
  for(const g of gates){
    const u=g.userData;if(pos.distanceToSquared(g.position)>u.rr)continue;
    const l=g.worldToLocal(pos.clone()),h=u.h,cy=u.cy,rad=u.tr+dR;
    const sg=[[-h,-h,h,-h],[-h,h,h,h],[-h,-h,-h,h],[h,-h,h,h],[-h,-h,-h,-cy],[h,-h,h,-cy]];
    for(const [ax,ay,bx2,by] of sg){
      const dx=bx2-ax,dy=by-ay,t=clamp(((l.x-ax)*dx+(l.y-ay)*dy)/(dx*dx+dy*dy),0,1);
      const nx=l.x-(ax+t*dx),ny=l.y-(ay+t*dy),dd=Math.hypot(nx,ny,l.z);
      if(dd<rad&&dd>1e-5){
        const n=new THREE.Vector3(nx,ny,l.z).divideScalar(dd).transformDirection(g.matrixWorld);
        pos.addScaledVector(n,rad-dd);
        const vn=vel.dot(n);
        if(vn<0){vel.addScaledVector(n,-1.4*vn);hurt(-vn);if(crashed)return}
        break;
      }
    }
  }
  if(!running&&pos.y>0.2){running=true;t0=performance.now()}

  if(N>0){
  const gt=gates[next],l=gt.worldToLocal(pos.clone());
  if(prevZ!==null&&prevZ<0&&l.z>=0&&Math.max(Math.abs(l.x),Math.abs(l.y))<gt.userData.h-.06){
    next++;prevZ=null;
    if(next>=N){const t=(performance.now()-t0)/1000;laps++;if(best===null||t<best)best=t;
      if(isOpen){beep(2000,.3,.25);crash('ФИНИШ '+t.toFixed(1)+' с',true);return}
      next=0;t0=performance.now()}
    paintGates();beep(1500,.09,.2);if(next===0)setTimeout(()=>beep(2000,.15,.2),130);
  }else prevZ=l.z;
  }

  sig+=(signalTarget()-sig)*Math.min(1,dt*3);
  if(sig<0.05){sigLost+=dt;if(sigLost>3.5)crash('FAILSAFE: ПОТЕРЯ СВЯЗИ')}else sigLost=0;
}

/* ---------- OSD ---------- */
function drawOsd(now){
  const w=oc.width,h=oc.height,fs=Math.round(h*0.05),m=h*.035;
  ox.clearRect(0,0,w,h);ox.font=`bold ${fs}px "Courier New",monospace`;ox.textBaseline='top';
  const T=(s,x,y,al)=>{ox.textAlign=al;ox.fillStyle='#000';ox.fillText(s,x+1.5,y+1.5);ox.fillStyle='#f4f4f4';ox.fillText(s,x,y)};
  T('LQ '+Math.round(sig*100),m,m,'left');
  T('GATE '+next+'/'+N,m,m+fs*1.15,'left');
  T('LAP '+(running?((performance.now()-t0)/1000).toFixed(1):'0.0')+(best!==null?'  BEST '+best.toFixed(1):''),m,m+fs*2.3,'left');
  T('HP '+Math.round(hp),m,m+fs*3.45,'left');
  T('FPVSIM',w-m,m+fs*1.2,'right');T(cells+'S '+Math.max(0,volt*cells).toFixed(2)+'V',w/2,m,'center');
  const by=h-m-fs,cx=w/2,mm=Math.floor(flightT/60),ss=Math.floor(flightT%60);
  T((mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss,m,by,'left');
  ox.strokeStyle='#f4f4f4';ox.lineWidth=2;ox.strokeRect(cx-fs*2.4,by+fs*.12,fs*.9,fs*.62);
  ox.fillStyle='#f4f4f4';ox.fillRect(cx-fs*2.4+2,by+fs*.12+2,(fs*.9-4)*clamp((volt-3.2)/1.1,0,1),fs*.62-4);ox.fillRect(cx-fs*1.5,by+fs*.3,3,fs*.26);
  T(Math.max(0,volt).toFixed(2)+'v',cx-fs*1.25,by,'left');
  T(mode==='acro'?'AIR':'ANGL '+mode[1],w-m,by,'right');
  ox.strokeStyle='#f4f4f4';ox.lineWidth=2;ox.beginPath();ox.arc(cx,h/2,fs*.32,0,6.283);ox.stroke();
  ox.beginPath();ox.moveTo(cx-fs*.7,h/2);ox.lineTo(cx-fs*.32,h/2);ox.moveTo(cx+fs*.32,h/2);ox.lineTo(cx+fs*.7,h/2);ox.moveTo(cx,h/2-fs*.7);ox.lineTo(cx,h/2-fs*.32);ox.stroke();
  if(volt<3.45&&Math.floor(now/450)%2)T('LOW BATTERY',cx,h*.8,'center');
  if(sig<.2&&Math.floor(now/450)%2)T('LINK LOST',cx,h*.28,'center');
  otex.needsUpdate=true;
}

/* ---------- replay: запись, просмотр и скачивание полётов ---------- */
const RP={on:false,playing:false,t:0,idx:0,speed:1,cam:'fpv',dist:1.4,run:null,rec:null,snap:null,fromMenu:false,pendingReset:false,lastNext:0,lastHit:0,ccInit:false,seeking:false,
  lastFwd:new THREE.Vector3(0,0,-1),fwd:new THREE.Vector3(),tgt:new THREE.Vector3(),ccp:new THREE.Vector3()};
let rec=[],recMeta=null,recAcc=0,recEnd='',runs=[],model=null,outUrl=null;
const REC_MAX=18000,qa=new THREE.Quaternion(),qb=new THREE.Quaternion();
const fmtT=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
function toast(t){const m=$('msg');m.style.color='#fff';m.textContent=t;m.style.display='flex';setTimeout(()=>{if(m.textContent===t)m.style.display='none'},1600)}
function metaNow(){
  const mm=(S.customMaps||[]).find(m=>m.id===S.map),mp=MAPS.find(x=>x[0]===S.map);
  return {map:S.map,mapName:mp?mp[1]:(mm?mm.name:S.map),drone:S.drone,droneName:cur.n,gate:S.gate,date:Date.now()};
}
function recSample(){
  if(rec.length>=REC_MAX)return;
  if(!rec.length)recMeta=metaNow();
  const t=rec.length?rec[rec.length-1][0]+1/30:0;
  rec.push([t,pos.x,pos.y,pos.z,q.x,q.y,q.z,q.w,thrNow,noise,hit,sig,hp,volt,next,flightT,Math.max(0,MODES.indexOf(mode)),running?(performance.now()-t0)/1000:0]);
}
function getRuns(){
  const l=runs.slice();
  if(rec.length>20)l.unshift({frames:rec,meta:recMeta,end:recEnd||(crashed?'Конец':'Идёт полёт'),cur:true});
  return l;
}
/* 3D-модель дрона для внешней камеры */
function makeModel(){
  if(model){drone.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  const wb=cur.wb/1000,o=wb/2/1.414,pr=wb*.27;
  const dark=new THREE.MeshLambertMaterial({color:0x1b1d22}),dm=new THREE.MeshLambertMaterial({color:new THREE.Color(S.gcolor)});
  model=new THREE.Group();model.props=[];
  model.add(new THREE.Mesh(new THREE.BoxGeometry(wb*.45,wb*.14,wb*.6),dark));
  const bat=new THREE.Mesh(new THREE.BoxGeometry(wb*.3,wb*.08,wb*.4),new THREE.MeshLambertMaterial({color:0x3a6aa8}));bat.position.y=wb*.11;model.add(bat);
  const cm=new THREE.Mesh(new THREE.BoxGeometry(wb*.2,wb*.15,wb*.12),dark);cm.position.set(0,wb*.03,-wb*.32);model.add(cm);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([x,z])=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(wb*.04,wb*.03,wb/2),dark);arm.position.set(x*o/2,0,z*o/2);arm.rotation.y=Math.atan2(x,z);model.add(arm);
    const duct=new THREE.Mesh(new THREE.TorusGeometry(pr+wb*.02,wb*.02,6,22),dm);duct.rotation.x=Math.PI/2;duct.position.set(x*o,wb*.02,z*o);model.add(duct);
    const pg=new THREE.Group();pg.position.set(x*o,wb*.1,z*o);
    pg.add(new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,wb*.004,20),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.2})));
    pg.add(new THREE.Mesh(new THREE.BoxGeometry(pr*1.9,wb*.006,wb*.05),dark));
    model.add(pg);model.props.push(pg);
  });
  model.scale.setScalar(2.4);model.visible=false;drone.add(model);
}
function setRpCam(c,restore){
  RP.cam=c;
  if(c==='fpv'||restore){
    if(cam.parent!==drone){scene.remove(cam);drone.add(cam)}
    cam.position.set(0,.012,-.035);cam.up.set(0,1,0);cam.rotation.set(S.tilt*Math.PI/180,0,0);
    resize();if(model)model.visible=false;
  }else{
    if(cam.parent===drone){drone.remove(cam);scene.add(cam)}
    cam.up.set(0,c==='top'?0:1,c==='top'?-1:0);cam.fov=c==='top'?60:70;cam.updateProjectionMatrix();
    if(model)model.visible=true;RP.ccInit=false;
  }
  document.querySelectorAll('#replay [data-cam]').forEach(b=>b.classList.toggle('on',b.dataset.cam===RP.cam));
}
function rpCam(dt){
  if(model&&model.visible)model.props.forEach((p,i)=>{p.rotation.y=spinA*(i%2?1:-1)});
  if(RP.cam==='fpv')return;
  const f=RP.fwd.set(0,0,-1).applyQuaternion(q);f.y=0;
  if(f.lengthSq()<1e-4)f.copy(RP.lastFwd);f.normalize();RP.lastFwd.copy(f);
  if(RP.cam==='chase'){RP.tgt.copy(pos).addScaledVector(f,-RP.dist);RP.tgt.y+=RP.dist*.35}
  else{RP.tgt.copy(pos);RP.tgt.y+=Math.max(3,RP.dist*4);RP.tgt.z+=.01}
  if(!RP.ccInit){RP.ccp.copy(RP.tgt);RP.ccInit=true}else RP.ccp.lerp(RP.tgt,1-Math.exp(-dt*8));
  RP.ccp.y=Math.max(.06,RP.ccp.y);RP.ccp.x=clamp(RP.ccp.x,-HW+.1,HW-.1);RP.ccp.z=clamp(RP.ccp.z,-HD+.1,HD-.1);
  cam.position.copy(RP.ccp);cam.lookAt(pos);
}
function openReplay(run){
  const list=getRuns();run=run||list[0];
  if(!run){toast('Записей пока нет: сначала взлети');return}
  if(!RP.on){
    RP.snap={pos:pos.clone(),vel:vel.clone(),q:q.clone(),pit,rol,yaw,next,prevZ,running,t0,crashed,hp,hit,sig,sigLost,thrNow,used,volt,flightT,mode,S:{map:S.map,drone:S.drone,gate:S.gate},tEnter:performance.now()};
    RP.fromMenu=$('start').style.display!=='none';
    $('start').style.display='none';$('mapmenu').style.display='none';
    RP.on=true;RP.pendingReset=false;
    if(!ac)audioInit();
  }
  const m=run.meta;
  if(m.map!==S.map||m.drone!==S.drone||m.gate!==S.gate){S.map=m.map;S.drone=m.drone;S.gate=m.gate;build();applyDrone()}
  makeModel();
  RP.run=run;RP.t=0;RP.idx=0;RP.playing=true;RP.lastNext=0;RP.lastHit=0;
  setRpCam(RP.cam);
  $('rp-info').textContent=m.mapName+' · '+m.droneName+' · '+run.end;
  $('replay').style.display='block';$('replay').classList.remove('rp-rec');$('rp-out').innerHTML='';
  updateRpUI();
}
function closeReplay(){
  if(!RP.on)return;
  stopRec(true);
  const sn=RP.snap;
  if(S.map!==sn.S.map||S.drone!==sn.S.drone||S.gate!==sn.S.gate){S.map=sn.S.map;S.drone=sn.S.drone;S.gate=sn.S.gate;build();applyDrone()}
  RP.on=false;setRpCam('fpv',true);
  if(RP.pendingReset){RP.pendingReset=false;reset()}
  else{
    pos.copy(sn.pos);vel.copy(sn.vel);q.copy(sn.q);pit=sn.pit;rol=sn.rol;yaw=sn.yaw;next=sn.next;prevZ=sn.prevZ;running=sn.running;
    t0=sn.t0+(performance.now()-sn.tEnter);crashed=sn.crashed;hp=sn.hp;hit=sn.hit;sig=sn.sig;sigLost=sn.sigLost;thrNow=sn.thrNow;used=sn.used;volt=sn.volt;flightT=sn.flightT;mode=sn.mode;paintGates();
  }
  $('replay').style.display='none';$('rp-out').innerHTML='';
  if(outUrl){URL.revokeObjectURL(outUrl);outUrl=null}
  if(RP.fromMenu){$('start').style.display='flex';renderMenu()}
  applyS();
}
function replayStep(dt){
  const fr=RP.run.frames,dur=fr[fr.length-1][0];
  if(RP.playing){RP.t+=dt*RP.speed;if(RP.t>=dur){RP.t=dur;RP.playing=false;rpEnded()}}
  let i=RP.idx;if(i>=fr.length-1||fr[i][0]>RP.t)i=0;
  while(i<fr.length-2&&fr[i+1][0]<=RP.t)i++;
  RP.idx=i;
  const a=fr[i],b=fr[Math.min(i+1,fr.length-1)],f=b[0]>a[0]?clamp((RP.t-a[0])/(b[0]-a[0]),0,1):0,L=k=>a[k]+(b[k]-a[k])*f;
  pos.set(L(1),L(2),L(3));qa.set(a[4],a[5],a[6],a[7]);qb.set(b[4],b[5],b[6],b[7]);q.copy(qa).slerp(qb,f);
  thrNow=L(8);hit=L(10);sig=L(11);hp=a[12];volt=L(13);flightT=L(15);next=a[14];mode=MODES[a[16]]||'a2';
  running=a[17]>0;t0=performance.now()-a[17]*1000;
  if(next!==RP.lastNext){if(next>RP.lastNext)beep(1500,.09,.2);RP.lastNext=next;paintGates()}
  if(hit>RP.lastHit+.15)thump(Math.min(1,hit+.2));
  RP.lastHit=hit;
  updateSeek(dur);
}
function rpEnded(){
  updateRpUI();
  if(RP.rec&&!RP.rec.tail){RP.rec.tail=1;setTimeout(()=>stopRec(false),700)}
}
function updateSeek(dur){
  if(!RP.seeking)$('rp-seek').value=Math.round(RP.t/dur*1000);
  $('rp-time').textContent=fmtT(RP.t)+' / '+fmtT(dur);
  const pg=$('rp-prog');if(pg)pg.textContent=Math.round(RP.t/dur*100)+'%';
}
function updateRpUI(){
  $('rp-play').textContent=RP.playing?'⏸':'▶';
  document.querySelectorAll('#replay [data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===RP.speed));
  document.querySelectorAll('#replay [data-cam]').forEach(b=>b.classList.toggle('on',b.dataset.cam===RP.cam));
}
function showFile(blob,name,label,isVideo){
  if(outUrl)URL.revokeObjectURL(outUrl);
  outUrl=URL.createObjectURL(blob);
  let file=null,can=false;
  try{file=new File([blob],name,{type:blob.type});can=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(_){}
  const kb=Math.round(blob.size/1024);
  $('rp-out').innerHTML="<div><b>"+label+"</b> · "+(kb>1024?(kb/1024).toFixed(1)+' МБ':kb+' КБ')+"<br>"+
    (isVideo?"<video src='"+outUrl+"' controls playsinline style='max-width:100%;max-height:110px;margin:6px 0'></video><br>":'')+
    "<a class='btnlink' href='"+outUrl+"' download='"+name+"'>СОХРАНИТЬ ФАЙЛ</a>"+(can?" <button id='rp-share'>ПОДЕЛИТЬСЯ / В ГАЛЕРЕЮ</button>":'')+" <button id='rp-clear'>ОК</button></div>";
  if(can)$('rp-share').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
  $('rp-clear').onclick=()=>{$('rp-out').innerHTML=''};
}
const rpStamp=()=>new Date(RP.run.meta.date).toISOString().slice(0,16).replace(/[:T]/g,'-');
function exportJson(){
  const run=RP.run;
  const data={v:1,app:'AmirFPV',meta:run.meta,end:run.end,fields:['t','x','y','z','qx','qy','qz','qw','thr','noise','hit','sig','hp','volt','next','flightT','mode','lapT'],frames:run.frames};
  const txt=JSON.stringify(data,(k,v)=>typeof v==='number'?Math.round(v*1e4)/1e4:v);
  showFile(new Blob([txt],{type:'application/json'}),'replay_'+rpStamp()+'.json','Данные повтора (JSON)',false);
}
function recordVideo(){
  if(RP.rec)return;
  const mimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  let mime=null;try{mime=window.MediaRecorder&&vc.captureStream?mimes.find(m=>MediaRecorder.isTypeSupported(m)):null}catch(_){}
  if(!mime){toast('Запись видео здесь не поддерживается. Скачай данные (.json)');return}
  const stream=vc.captureStream(30);let dest=null;
  try{if(ac&&master){dest=ac.createMediaStreamDestination();master.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}}catch(_){dest=null}
  const chunks=[],mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    try{if(dest)master.disconnect(dest)}catch(_){}
    const ok=RP.rec&&!RP.rec.cancel;RP.rec=null;$('replay').classList.remove('rp-rec');
    if(ok&&chunks.length){const type=mime.split(';')[0];showFile(new Blob(chunks,{type}),'replay_'+rpStamp()+'.'+(type==='video/mp4'?'mp4':'webm'),'Видео повтора',true)}
    else $('rp-out').innerHTML='';
    updateRpUI();
  };
  RP.t=0;RP.idx=0;RP.speed=1;RP.playing=true;RP.lastNext=0;RP.lastHit=0;RP.ccInit=false;
  RP.rec={mr,cancel:false,tail:0};
  $('replay').classList.add('rp-rec');
  $('rp-out').innerHTML="<div>Запись видео… <b id='rp-prog'>0%</b> <button id='rp-cancel'>ОТМЕНА</button></div>";
  $('rp-cancel').onclick=()=>stopRec(true);
  mr.start(500);updateRpUI();
}
function stopRec(cancel){
  if(!RP.rec)return;
  RP.rec.cancel=!!cancel;
  try{RP.rec.mr.stop()}catch(_){RP.rec=null;$('replay').classList.remove('rp-rec')}
}
function showRuns(){
  const L=getRuns();
  $('rp-out').innerHTML="<div class='rp-list'>"+L.map((r,i)=>"<button data-run='"+i+"'>#"+(L.length-i)+" · "+fmtT(r.frames[r.frames.length-1][0])+" · "+r.meta.mapName+" · "+r.meta.droneName+" · "+r.end+"</button>").join('')+"</div>";
  $('rp-out').querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>openReplay(L[+b.dataset.run]));
}
$('replaybtn').onclick=()=>openReplay();
$('brp').onclick=()=>openReplay();
$('rp-close').onclick=closeReplay;
$('rp-fold').onclick=()=>{const r=$('replay');r.classList.toggle('rp-hide');$('rp-fold').textContent=r.classList.contains('rp-hide')?'▴':'▾'};
$('rp-play').onclick=()=>{const fr=RP.run.frames;if(RP.t>=fr[fr.length-1][0]-.01){RP.t=0;RP.idx=0}RP.playing=!RP.playing;updateRpUI()};
$('rp-restart').onclick=()=>{RP.t=0;RP.idx=0;RP.playing=true;RP.lastNext=0;RP.lastHit=0;updateRpUI()};
$('rp-seek').addEventListener('pointerdown',()=>{RP.seeking=true});
addEventListener('pointerup',()=>{RP.seeking=false});addEventListener('pointercancel',()=>{RP.seeking=false});
$('rp-seek').oninput=e=>{const fr=RP.run.frames;RP.t=+e.target.value/1000*fr[fr.length-1][0];RP.idx=0};
document.querySelectorAll('#replay [data-sp]').forEach(b=>b.onclick=()=>{RP.speed=+b.dataset.sp;updateRpUI()});
document.querySelectorAll('#replay [data-cam]').forEach(b=>b.onclick=()=>setRpCam(b.dataset.cam));
$('rp-dist').oninput=e=>{RP.dist=+e.target.value};
$('rp-video').onclick=recordVideo;$('rp-json').onclick=exportJson;$('rp-runs').onclick=showRuns;

/* ---------- loop ---------- */
resize();applyDrone();build();reset();applyS();renderMenu();
let last=performance.now(),hudT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(RP.on)replayStep(dt);else if(started&&!crashed&&!paused)step(dt);
  if(!RP.on&&started&&!paused&&!crashed&&(rec.length||running||inp.thr>.03)){recAcc+=dt;if(recAcc>=1/30){recAcc-=1/30;recSample()}}
  const dm=1-hp/100;
  drone.position.copy(pos);drone.quaternion.copy(q);if(RP.on)rpCam(dt);
  if(skyG)skyG.position.copy(pos);
  if(!RP.on)hit=Math.max(0,hit-dt*0.8);
  noise=clamp((0.55-sig)/0.5,0,1);noise=Math.max(noise,hit*0.6,dm*0.2);
  U.time.value=now/1000;U.noise.value=noise;U.hit.value=hit*.6;
  if(ac){const t=ac.currentTime,on=(RP.on?RP.playing:(started&&!crashed&&!paused))&&thrNow>0.02,r=Math.sqrt(thrNow/TWR);
    mo1.frequency.setTargetAtTime((220+1100*r)*snd,t,.05);mo2.frequency.setTargetAtTime((440+2200*r)*snd,t,.05);
    mg.gain.setTargetAtTime(on?.03+.07*r:0,t,.05);ng.gain.setTargetAtTime(on?.01+.05*r:0,t,.08);
    hg.gain.setTargetAtTime(noise*.18,t,.05);
    if(volt<3.45&&started&&!crashed&&!RP.on&&now-lastLB>1000){lastLB=now;beep(2200,.12,.15)}}
  const sr=(RP.on?RP.playing:(started&&!crashed&&!paused))?Math.sqrt(thrNow/TWR):0;spinA=(spinA+dt*(20+380*sr))%6.2832;U.spin.value=spinA;U.spd.value=clamp(sr*1.6-.2,0,1);
  hudT+=dt;if(hudT>0.1){hudT=0;drawOsd(now)}
  if(RP.on&&RP.cam!=='fpv'){renderer.setRenderTarget(null);renderer.render(scene,cam)}
  else{renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(pscene,pcam)}
  $('hit').style.opacity=hit*0.7;
}
requestAnimationFrame(frame);
})();
